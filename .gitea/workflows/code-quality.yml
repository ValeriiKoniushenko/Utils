name: Code Quality

on:
  pull_request:
  push:
    branches:
      - develop

# Serialize workflow runs so Gitea review updates for this repository do not overlap.
concurrency:
  group: utils-ci-shared-cache
  cancel-in-progress: false

jobs:
  clear-previous-ci-reviews:
    name: "[cleanup] previous CI reviews"
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove previous CI reviews
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: python3 .gitea/clear_ci_reviews.py

  clang-format:
    name: "[fmt] clang-format"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check clang-format
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_clang_format.py --base develop

  build:
    name: "[build] clang (linux)"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          echo "::group::CMake configure"
          cmake --fresh -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=ON \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          echo "::endgroup::"

      - name: Build
        run: |
          echo "::group::Build"
          cmake --build build -j$(nproc)
          echo "::endgroup::"
          {
            echo "## Build: clang"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

  build-gcc:
    name: "[build] gcc (linux)"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CC: gcc
      CXX: g++
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake --fresh -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=ON \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          echo "::group::Build"
          cmake --build build -j$(nproc)
          echo "::endgroup::"
          {
            echo "## Build: gcc"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
  clang-tidy:
    name: "[lint] clang-tidy"
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch develop for diffing
        run: |
          echo "::group::Ensuring full history for diff"
          git fetch origin develop:refs/remotes/origin/develop
          echo "::endgroup::"

      - name: Configure tests for analysis headers
        run: |
          cmake --fresh -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Check clang-tidy
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          set +e
          python3 .gitea/check_clang_tidy.py \
            --base develop \
            --build-dir build \
            --fail-on error
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 1 ]; then
            echo "clang-tidy found issues, but continuing (non-blocking mode)"
            exit 0
          fi
          exit $exit_code

  unit-tests:
    name: "[test] unit tests (clang)"
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (tests enabled)
        run: |
          cmake --fresh -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: |
          echo "::group::UtilsTests"
          build/bin/UtilsTests
          echo "::endgroup::"

  valgrind:
    name: "[test] valgrind (clang)"
    needs: unit-tests
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure tests
        run: |
          cmake --fresh -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: cmake --build build -j$(nproc)

      - name: Run tests under Valgrind
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          set -o pipefail
          python3 .gitea/check_valgrind.py \
            --executable build/bin/UtilsTests \
            --verbose 2>&1 | tee valgrind-output.txt
