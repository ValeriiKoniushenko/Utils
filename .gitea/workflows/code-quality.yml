name: Code Quality

on:
  pull_request:
  push:
    branches:
      - develop

# Serialize workflow runs so Gitea review updates and persistent build-cache writes
# for this repository do not overlap. Build jobs use four distinct cache slots.
# Test executables cross runner boundaries as artifacts because dependent jobs are
# not guaranteed to run on the same host as their build job.
concurrency:
  group: utils-ci-shared-cache
  cancel-in-progress: false

jobs:
  clear-previous-ci-reviews:
    name: "[cleanup] previous CI reviews"
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove previous CI reviews
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: python3 .gitea/clear_ci_reviews.py

  clang-format:
    name: "[fmt] clang-format"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check clang-format
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/check_clang_format.py --base develop

  build-gcc-debug:
    name: "[build] gcc debug (linux)"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/utils/build-gcc-debug-v1:/build-cache
    env:
      CCACHE_DIR: /ccache
      CC: gcc
      CXX: g++
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build cache
        run: |
          mkdir -p build
          if grep -Fqx "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE" /build-cache/CMakeCache.txt 2>/dev/null \
            && grep -Fqx "CMAKE_BUILD_TYPE:STRING=Debug" /build-cache/CMakeCache.txt 2>/dev/null; then
            echo "Restoring compatible GCC Debug build cache"
            rsync -a --delete /build-cache/ build/
          else
            echo "No compatible GCC Debug build cache; configuring from scratch"
          fi

      - name: Configure Debug
        run: |
          echo "::group::CMake configure"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          echo "::endgroup::"

      - name: Build Debug
        run: |
          echo "::group::Build"
          cmake --build build -j$(( ($(nproc) + 3) / 4 ))
          echo "::endgroup::"
          {
            echo "## Build: gcc Debug"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build cache
        run: rsync -a --delete build/ /build-cache/

      - name: Upload GCC Debug test executable
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: utils-tests-gcc-debug
          path: build/bin/UtilsTests
          if-no-files-found: error
          retention-days: 1

  build-gcc-release:
    name: "[build] gcc release (linux)"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/utils/build-gcc-release-v1:/build-cache
    env:
      CCACHE_DIR: /ccache
      CC: gcc
      CXX: g++
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build cache
        run: |
          mkdir -p build
          if grep -Fqx "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE" /build-cache/CMakeCache.txt 2>/dev/null \
            && grep -Fqx "CMAKE_BUILD_TYPE:STRING=Release" /build-cache/CMakeCache.txt 2>/dev/null; then
            echo "Restoring compatible GCC Release build cache"
            rsync -a --delete /build-cache/ build/
          else
            echo "No compatible GCC Release build cache; configuring from scratch"
          fi

      - name: Configure Release
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Release
        run: |
          echo "::group::Build"
          cmake --build build -j$(( ($(nproc) + 3) / 4 ))
          echo "::endgroup::"
          {
            echo "## Build: gcc Release"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build cache
        run: rsync -a --delete build/ /build-cache/

      - name: Upload GCC Release test executable
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: utils-tests-gcc-release
          path: build/bin/UtilsTests
          if-no-files-found: error
          retention-days: 1

  build-clang-debug:
    name: "[build] clang debug (linux)"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/utils/build-clang-debug-v1:/build-cache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
