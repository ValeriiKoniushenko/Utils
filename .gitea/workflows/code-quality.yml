          fi

      - name: Configure Release
        run: |
          echo "::group::CMake configure"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          echo "::endgroup::"

      - name: Build Release
        run: |
          echo "::group::Build"
          cmake --build build -j$(( ($(nproc) + 3) / 4 ))
          echo "::endgroup::"
          {
            echo "## Build: clang Release"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build cache
        run: rsync -a --delete build/ /build-cache/

  test-gcc-debug:
    name: "[test] gcc debug (linux)"
    needs: build-gcc-debug
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/utils/build-gcc-debug-v1:/build-cache
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore GCC Debug build
        run: |
          if ! grep -Fqx "CMAKE_BUILD_TYPE:STRING=Debug" /build-cache/CMakeCache.txt 2>/dev/null \
            || [ ! -x /build-cache/bin/UtilsTests ]; then
            echo "GCC Debug build cache is missing or incompatible" >&2
            exit 1
          fi
          mkdir -p build
          rsync -a --delete /build-cache/ build/

      - name: Run GCC Debug unit tests
        run: |
          echo "::group::UtilsTests (GCC Debug)"
          build/bin/UtilsTests
          echo "::endgroup::"
          {
            echo "## Tests: gcc Debug"
            echo "Unit tests succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

  test-gcc-release:
    name: "[test] gcc release (linux)"
    needs: build-gcc-release
    runs-on: linux
    container:
      image: cpp-ci:latest
