      - name: Restore build cache
        run: |
          mkdir -p build
          if grep -Fqx "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE" /build-cache/CMakeCache.txt 2>/dev/null \
            && grep -Fqx "CMAKE_BUILD_TYPE:STRING=Debug" /build-cache/CMakeCache.txt 2>/dev/null; then
            echo "Restoring compatible Clang Debug build cache"
            rsync -a --delete /build-cache/ build/
          else
            echo "No compatible Clang Debug build cache; configuring from scratch"
          fi

      - name: Configure Debug
        run: |
          echo "::group::CMake configure"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          echo "::endgroup::"

      - name: Build Debug
        run: |
          echo "::group::Build"
          cmake --build build -j$(( ($(nproc) + 3) / 4 ))
          echo "::endgroup::"
          {
            echo "## Build: clang Debug"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build cache
        run: rsync -a --delete build/ /build-cache/

      - name: Upload Clang Debug test executable
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: utils-tests-clang-debug
          path: build/bin/UtilsTests
          if-no-files-found: error
          retention-days: 1

  build-clang-release:
    name: "[build] clang release (linux)"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/utils/build-clang-release-v1:/build-cache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build cache
        run: |
          mkdir -p build
          if grep -Fqx "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE" /build-cache/CMakeCache.txt 2>/dev/null \
            && grep -Fqx "CMAKE_BUILD_TYPE:STRING=Release" /build-cache/CMakeCache.txt 2>/dev/null; then
            echo "Restoring compatible Clang Release build cache"
            rsync -a --delete /build-cache/ build/
          else
            echo "No compatible Clang Release build cache; configuring from scratch"
          fi

      - name: Configure Release
        run: |
          echo "::group::CMake configure"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          echo "::endgroup::"

      - name: Build Release
        run: |
          echo "::group::Build"
          cmake --build build -j$(( ($(nproc) + 3) / 4 ))
          echo "::endgroup::"
          {
            echo "## Build: clang Release"
            echo "Build succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build cache
        run: rsync -a --delete build/ /build-cache/

      - name: Upload Clang Release test executable
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: utils-tests-clang-release
          path: build/bin/UtilsTests
          if-no-files-found: error
          retention-days: 1

  test-gcc-debug:
    name: "[test] gcc debug (linux)"
    needs: build-gcc-debug
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GCC Debug test executable
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: utils-tests-gcc-debug
          path: build/bin

      - name: Prepare GCC Debug test executable
        run: chmod +x build/bin/UtilsTests

      - name: Run GCC Debug unit tests
        run: |
          python3 .gitea/check_unit_tests.py \
            --label "GCC Debug" \
            --context unit-tests-gcc-debug \
            --report-path unit-test-report.json \
            --no-gitea \
            --verbose

      - name: Upload GCC Debug test report
        if: ${{ always() }}
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: unit-test-report-gcc-debug
          path: unit-test-report.json
          if-no-files-found: error
          retention-days: 1

  test-gcc-release:
    name: "[test] gcc release (linux)"
    needs: build-gcc-release
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GCC Release test executable
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: utils-tests-gcc-release
          path: build/bin

      - name: Prepare GCC Release test executable
        run: chmod +x build/bin/UtilsTests

      - name: Run GCC Release unit tests
        run: |
          python3 .gitea/check_unit_tests.py \
            --label "GCC Release" \
            --context unit-tests-gcc-release \
            --report-path unit-test-report.json \
            --no-gitea \
            --verbose

      - name: Upload GCC Release test report
        if: ${{ always() }}
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: unit-test-report-gcc-release
          path: unit-test-report.json
          if-no-files-found: error
          retention-days: 1

  test-clang-debug:
    name: "[test] clang debug (linux)"
    needs: build-clang-debug
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Clang Debug test executable
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: utils-tests-clang-debug
          path: build/bin

      - name: Prepare Clang Debug test executable
        run: chmod +x build/bin/UtilsTests

      - name: Run Clang Debug unit tests
        run: |
          python3 .gitea/check_unit_tests.py \
            --label "Clang Debug" \
            --context unit-tests-clang-debug \
            --report-path unit-test-report.json \
            --no-gitea \
            --verbose

      - name: Upload Clang Debug test report
        if: ${{ always() }}
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: unit-test-report-clang-debug
          path: unit-test-report.json
          if-no-files-found: error
          retention-days: 1

