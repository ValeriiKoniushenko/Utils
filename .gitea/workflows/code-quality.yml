    name: "[test] clang release (linux)"
    needs: build-clang-release
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/utils/build-clang-release-v1:/build-cache
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Clang Release build
        run: |
          if ! grep -Fqx "CMAKE_BUILD_TYPE:STRING=Release" /build-cache/CMakeCache.txt 2>/dev/null \
            || [ ! -x /build-cache/bin/UtilsTests ]; then
            echo "Clang Release build cache is missing or incompatible" >&2
            exit 1
          fi
          mkdir -p build
          rsync -a --delete /build-cache/ build/

      - name: Run Clang Release unit tests
        run: |
          echo "::group::UtilsTests (Clang Release)"
          build/bin/UtilsTests
          echo "::endgroup::"
          {
            echo "## Tests: clang Release"
            echo "Unit tests succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

  clang-tidy:
    name: "[lint] clang-tidy"
    needs: build-clang-debug
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/utils/build-clang-debug-v1:/build-cache
        - /srv/ci-cache/utils/clang-tidy-v1:/clang-tidy-cache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch develop for diffing
        run: |
          echo "::group::Ensuring full history for diff"
          git fetch origin develop:refs/remotes/origin/develop
          echo "::endgroup::"

      - name: Restore build cache
        run: |
          mkdir -p build
          if grep -Fqx "CMAKE_HOME_DIRECTORY:INTERNAL=$GITHUB_WORKSPACE" /build-cache/CMakeCache.txt 2>/dev/null \
            && grep -Fqx "CMAKE_BUILD_TYPE:STRING=Debug" /build-cache/CMakeCache.txt 2>/dev/null; then
            echo "Restoring compatible Clang Debug build cache"
            rsync -a --delete /build-cache/ build/
          else
            echo "No compatible Clang Debug build cache; configuring from scratch"
          fi

      - name: Configure tests for analysis headers
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUTILS_DISABLE_TESTS=OFF \
            -DUTILS_DISABLE_BENCHMARKS=ON \
            -DBUILD_UTILS_WITH_TEST_COVERAGE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Check clang-tidy
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          set +e
          python3 .gitea/check_clang_tidy.py \
            --base develop \
            --build-dir build \
            --cache-dir /clang-tidy-cache \
            --jobs $(( ($(nproc) + 3) / 4 )) \
            --fail-on error
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 1 ]; then
            echo "clang-tidy found issues, but continuing (non-blocking mode)"
            exit 0
          fi
          exit $exit_code

  valgrind:
    name: "[test] valgrind (clang)"
    needs: test-clang-debug
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
        - /srv/ci-cache/utils/build-clang-debug-v1:/build-cache
    env:
      CCACHE_DIR: /ccache
      CC: clang
      CXX: clang++
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore build cache
        run: |
          if ! grep -Fqx "CMAKE_BUILD_TYPE:STRING=Debug" /build-cache/CMakeCache.txt 2>/dev/null \
            || [ ! -x /build-cache/bin/UtilsTests ]; then
            echo "Clang Debug build cache is missing or incompatible" >&2
            exit 1
          fi
          mkdir -p build
          rsync -a --delete /build-cache/ build/

      - name: Run tests under Valgrind
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          set -o pipefail
          python3 .gitea/check_valgrind.py \
            --executable build/bin/UtilsTests \
            --verbose 2>&1 | tee valgrind-output.txt
