name: utils
title: Utils
version: ~
nav:
  - modules/ROOT/nav.adoc

ext:
  collector:
    scan:
      - dir: sources
        files: '**/*.h'
        into: modules/ROOT/examples/sources
      - dir: tests
        files: '*.cpp'
        into: modules/ROOT/examples/tests
      - dir: benchmarks
        files: '*.{cpp,h}'
        into: modules/ROOT/examples/benchmarks
